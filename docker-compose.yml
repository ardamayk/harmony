services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      SERVER_ADDR: "127.0.0.1:8090"
      DATABASE_PATH: /data/app.db
      MANAGED_STORAGE_PATH: /data/managed
      # Listen Together stays off unless both are set; see server/README.md.
      GUEST_ADDR: ${GUEST_ADDR:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LISTEN_TOGETHER_MAX_GUESTS: ${LISTEN_TOGETHER_MAX_GUESTS:-}
      LISTEN_TOGETHER_ROOM_HOURS: ${LISTEN_TOGETHER_ROOM_HOURS:-}
      # The Owner's public address stays off unless all three are set; see
      # server/README.md.
      OWNER_PUBLIC_URL: ${OWNER_PUBLIC_URL:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Unset = nothing is sent; see server/README.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    volumes:
      - app-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro

volumes:
  app-data:
