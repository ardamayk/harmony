services:
  server:
    image: ghcr.io/ardamayk/harmony-server:${HARMONY_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      SERVER_ADDR: "127.0.0.1:8090"
      DATABASE_PATH: /data/app.db
      MANAGED_STORAGE_PATH: /data/managed
      # Listen Together stays off unless both are set; see server/README.md.
      GUEST_ADDR: ${GUEST_ADDR:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LISTEN_TOGETHER_MAX_GUESTS: ${LISTEN_TOGETHER_MAX_GUESTS:-}
      LISTEN_TOGETHER_ROOM_HOURS: ${LISTEN_TOGETHER_ROOM_HOURS:-}
      # The Owner's public address stays off unless all are set; see
      # server/README.md.
      OWNER_PUBLIC_URL: ${OWNER_PUBLIC_URL:-}
      OWNER_JWT_HEADER: ${OWNER_JWT_HEADER:-}
      OWNER_JWKS_URL: ${OWNER_JWKS_URL:-}
      OWNER_JWT_ISSUER: ${OWNER_JWT_ISSUER:-}
      OWNER_JWT_AUDIENCE: ${OWNER_JWT_AUDIENCE:-}
      # Unset = nothing is sent; see server/README.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      # The External Source stays off unless the first is set, and you install
      # yt-dlp yourself; see server/README.md.
      EXTERNAL_SOURCE_SEARCH: ${EXTERNAL_SOURCE_SEARCH:-}
      EXTERNAL_SOURCE_EXTRACTOR_ARGS: ${EXTERNAL_SOURCE_EXTRACTOR_ARGS:-}
      EXTERNAL_SOURCE_NAME: ${EXTERNAL_SOURCE_NAME:-}
      YT_DLP: ${YT_DLP:-}
    volumes:
      - app-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro

volumes:
  app-data:
