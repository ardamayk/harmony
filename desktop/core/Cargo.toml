[package]
name = "earthly-audio-core"
version = "0.1.0"
description = "Harmony Desktop Client core: native playback, media proxy and Managed Import, driven by the Electron shell over stdio"
edition = "2024"

[lib]
name = "earthly_audio_core"

[[bin]]
name = "earthly-audio-core"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
# Opt-in panic, error, trace and metric reporting to the owner's own Sentry
# (ADR 0033); nothing starts without SENTRY_DSN. rustls only, no native-tls.
sentry = { version = "=0.49.3", default-features = false, features = ["backtrace", "contexts", "metrics", "panic", "reqwest", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "net", "rt-multi-thread", "sync"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["v4"] }

# MPRIS is the Linux desktop's media-control surface (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "=0.10.0", features = ["tokio"] }

# Windows: mpv's named-pipe IPC, its Job Object lifetime link, WASAPI endpoint
# discovery and volume, handle-based file identity for Desktop Import, and the
# IPolicyConfig interface Adaptive declares (windows-core's interface macro).
[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
sentry = { version = "=0.49.3", default-features = false, features = ["test"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }
toml = "=0.9.12"
