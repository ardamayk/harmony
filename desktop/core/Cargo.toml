[package]
name = "earthly-audio-core"
version = "0.1.0"
description = "Earthly Audio Desktop Client core: native playback, media proxy and Managed Import, driven by the Electron shell over stdio"
edition = "2024"

[lib]
name = "earthly_audio_core"

[[bin]]
name = "earthly-audio-core"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["v4"] }
mpris-server = { version = "=0.10.0", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "=0.9.12"
