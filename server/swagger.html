<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earthly Audio API Reference</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #f8fafc;
    }

    .topbar {
      display: none;
    }

    #api-reference-header {
      box-sizing: border-box;
      padding: 20px 32px 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
    }

    #api-reference-header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    #api-reference-header p {
      margin: 6px 0 0;
      color: #5b6472;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header id="api-reference-header">
    <h1>Earthly Audio API Reference</h1>
    <p>Generated from packages/contracts/openapi.yaml. Product docs live at /docs/.</p>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/api/openapi.yaml',
      dom_id: '#swagger-ui',
    })
  </script>
</body>
</html>
