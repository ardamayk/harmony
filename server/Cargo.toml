[package]
name = "earthly-music-server"
version = "0.1.0"
description = "Earthly Audio Music Server"
edition = "2024"
default-run = "earthly-music-server"

[[bin]]
name = "earthly-music-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "original-uri"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
caseless = "=0.2.2"
futures-util = "=0.3.34"
hex = "=0.4.3"
hmac = "=0.13.0"
httpdate = "=1.0.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libsqlite3-sys = "=0.37.0"
md-5 = "=0.11.0"
mime_guess = "=2.0.5"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["gzip", "rustls", "stream"] }
rust-embed = { version = "=8.12.0", features = ["mime-guess"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "vorbis"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["catch-panic", "cors", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "=0.1.5"
serde_yaml_ng = "=0.10.0"
tempfile = "=3.27.0"
