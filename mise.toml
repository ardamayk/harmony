[tools]
go = "1.26.6"
node = "24"
bun = "1.4.2"
golangci-lint = "2.12.2"
sqlc = "1.31.1"

[env]
# Use the workspace-pinned Vite+ (`vp`) and other local binaries.
_.path = ["{{config_root}}/node_modules/.bin"]

# --- Development -------------------------------------------------------------

[tasks.dev]
description = "Run the Music Server and Web Client in development mode"
run = "./scripts/run-with-music-server.sh development bun run --cwd web dev"

[tasks."desktop:dev"]
description = "Run the Music Server and Desktop Client in development mode"
run = "./scripts/run-with-music-server.sh development bun run --cwd desktop dev"

[tasks.start]
description = "Run the built Music Server and release Desktop Client"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ -x bin/server ]] || { echo "Missing bin/server; run 'mise run build' first." >&2; exit 1; }
./scripts/run-with-music-server.sh built bun run --cwd desktop start
"""

# --- Code generation ---------------------------------------------------------

[tasks.generate]
description = "Regenerate committed OpenAPI clients"
run = "bash scripts/generate-openapi.sh"

[tasks."generate:check"]
description = "Verify committed OpenAPI clients are current"
run = "bash scripts/check-openapi-generation.sh"

# --- Build -------------------------------------------------------------------

[tasks.build]
description = "Build the Music Server (with embedded Web Client and docs) and the Desktop Client"
depends = ["server:build", "desktop:build"]

[tasks."web:build"]
description = "Build the Web Client"
run = "bun run --cwd web build"

[tasks."docs:build"]
description = "Build the product documentation embedded by the Music Server"
run = "bun run --cwd packages/docs build"

[tasks."server:build"]
description = "Build the Music Server binary with embedded Web Client and docs"
depends = ["web:build", "docs:build"]
run = [
	"bash scripts/sync-static.sh",
	"cd server && go build -o ../bin/server ./cmd/server",
]

[tasks."desktop:build"]
description = "Build the release Desktop Client with pinned mpv"
depends = ["web:build"]
run = "bun run --cwd desktop build:sidecar:prepared"

# --- Static checks -----------------------------------------------------------

[tasks.format]
description = "Format TypeScript, Go, and Rust sources"
run = ["vp fmt", "cd server && go fmt ./...", "bun run --cwd desktop format"]

[tasks.check]
description = "Format, lint, and type-check every language"
depends = ["web:check", "server:check", "desktop:check"]

[tasks."web:check"]
description = "Oxfmt, Oxlint, and type checks for the TypeScript workspace"
run = "vp check"

[tasks."server:check"]
description = "gofmt and golangci-lint for the Music Server"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd server
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted" >&2; exit 1; fi
golangci-lint run
"""

[tasks."desktop:check"]
description = "rustfmt and Clippy for the Desktop Client"
run = ["bun run --cwd desktop format:check", "bun run --cwd desktop lint"]

# --- Tests -------------------------------------------------------------------

[tasks.test]
description = "Run TypeScript, Go, and Rust unit tests"
depends = ["web:test", "server:test", "desktop:test"]

[tasks."web:test"]
description = "Run Web Client, shared UI, and API client unit tests"
run = "vp run --filter web --filter @repo/ui --filter @repo/api-client test"

[tasks."server:test"]
description = "Run Music Server tests"
dir = "server"
run = "go test ./..."

[tasks."desktop:test"]
description = "Run Desktop Client unit tests"
run = "bun run --cwd desktop test"

[tasks."web:test:e2e"]
description = "Run Web Client Playwright tests"
run = "bun run --cwd web test:e2e"

[tasks."server:test:hls"]
description = "Run Music Server HLS browser integration tests"
dir = "server"
env = { RUN_HLS_BROWSER_INTEGRATION = "1" }
run = "go test ./internal/modules/radio -run TestBrowserHLSProxyIntegration -count=1 -v"

[tasks."desktop:test:mpv"]
description = "Run Desktop Client tests against pinned mpv"
run = ["bun run --cwd desktop prepare:mpv", "bun run --cwd desktop test:mpv"]

[tasks."desktop:test:import-parity"]
description = "Run Desktop Client Managed Import parity against a real Music Server"
run = "bun run --cwd desktop test:import-parity"

[tasks.ci]
description = "What CI runs on every pull request: static checks and unit tests"
depends = ["check", "test", "generate:check"]

[tasks."ci:integration"]
description = "Browser, HLS, and pinned-mpv integration tests"
depends = [
	"web:test:e2e",
	"server:test:hls",
	"desktop:test:mpv",
	"desktop:test:import-parity",
]
