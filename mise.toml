[tools]
go = "1.26.9"
node = "24"
bun = "1.4.2"
golangci-lint = "2.12.2"
sqlc = "1.31.1"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "sqlite,rustls" }

[env]
# Use the workspace-pinned Vite+ (`vp`) and other local binaries.
_.path = ["{{config_root}}/node_modules/.bin"]

# --- Development -------------------------------------------------------------

[tasks.dev]
description = "Run the Music Server and Web Client in development mode"
run = "./scripts/run-with-music-server.sh development bun run --cwd web dev"

[tasks."desktop:dev"]
description = "Run the Music Server and Desktop Client in development mode"
run = "./scripts/run-with-music-server.sh development bun run --cwd desktop dev"

[tasks.start]
description = "Run the built Music Server and release Desktop Client"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ -x bin/server ]] || { echo "Missing bin/server; run 'mise run build' first." >&2; exit 1; }
./scripts/run-with-music-server.sh built bun run --cwd desktop start
"""

# --- Code generation ---------------------------------------------------------

[tasks.generate]
description = "Regenerate committed OpenAPI clients and sqlc query packages"
run = ["bash scripts/generate-openapi.sh", "cd server && sqlc generate"]

[tasks."generate:check"]
description = "Verify committed OpenAPI clients and sqlc query packages are current"
run = ["bash scripts/check-openapi-generation.sh", "cd server && sqlc diff"]

# --- Build -------------------------------------------------------------------

[tasks.build]
description = "Build the Music Server (with embedded Web Client and docs) and the Electron Desktop Client"
depends = ["server:build", "desktop:build"]

[tasks."web:build"]
description = "Build the Web Client"
run = "bun run --cwd web build"

[tasks."web:lighthouse"]
description = "Check performance budgets (LCP, TBT/INP, CLS, TTFB) with Lighthouse on the production build"
depends = ["server:build"]
# Its own port, so a running development server is not measured instead.
env = { SERVER_ADDR = "127.0.0.1:8099", LIGHTHOUSE_BASE_URL = "http://127.0.0.1:8099" }
run = "./scripts/run-with-music-server.sh built bun run --cwd web lighthouse"

[tasks."perf:snapshot"]
description = "Print CPU and memory of the built Music Server, idle and streaming (plus a running Desktop Client)"
run = "bun scripts/perf-snapshot.ts"

[tasks."perf:server-load"]
description = "Startup, idle footprint, endpoint latency under load and stream throughput of the built Music Server"
run = "bun scripts/server-load.ts"

[tasks."docs:build"]
description = "Build the product documentation embedded by the Music Server"
run = "bun run --cwd packages/docs build"

[tasks."server:build"]
description = "Build the Music Server binary with embedded Web Client and docs"
depends = ["web:build", "docs:build"]
run = [
	"bash scripts/sync-static.sh",
	"cd server && go build -o ../bin/server ./cmd/server",
]

[tasks."server-rs:build"]
description = "Build the Rust Music Server (server-rs/, ADR 0025) with embedded Web Client and docs"
depends = ["web:build", "docs:build"]
run = [
	"bash scripts/sync-static.sh",
	"cargo build --release -p earthly-music-server",
]

[tasks."desktop:build"]
description = "Build the release Desktop Client: Rust core with pinned mpv, Electron shell bundle, Web Client"
depends = ["web:build"]
run = "bun run --cwd desktop build"

# --- Static checks -----------------------------------------------------------

[tasks.format]
description = "Format TypeScript, Go, and Rust sources"
run = [
	"bun --bun vp fmt",
	"cd server && go fmt ./...",
	"bun run --cwd desktop format",
]

[tasks.check]
description = "Format, lint, and type-check every language"
depends = ["web:check", "server:check", "server-rs:check", "desktop:check"]

[tasks."web:check"]
description = "Oxfmt, Oxlint, and type checks for the TypeScript workspace"
run = "bun --bun vp check"

[tasks."server:check"]
description = "gofmt and golangci-lint for the Music Server"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd server
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted" >&2; exit 1; fi
golangci-lint run
"""

[tasks."server-rs:check"]
description = "rustfmt, Clippy and current offline query data for the Rust Music Server"
run = [
	"cargo fmt -p earthly-music-server -- --check",
	"cargo clippy -p earthly-music-server --all-targets -- -D warnings",
	"bash scripts/sqlx-prepare.sh --check",
]

[tasks."desktop:check"]
description = "rustfmt and Clippy for the Desktop core (the Electron shell's TypeScript is in web:check)"
run = ["bun run --cwd desktop format:check", "bun run --cwd desktop lint"]

# --- Tests -------------------------------------------------------------------

[tasks.test]
description = "Run TypeScript, Go, and Rust unit tests"
depends = ["web:test", "server:test", "server-rs:test", "desktop:test"]

[tasks."web:test"]
description = "Run Web Client, shared UI, and API client unit tests"
run = "bun --bun vp run --filter web --filter @repo/ui --filter @repo/api-client test"

[tasks."server:test"]
description = "Run Music Server tests"
dir = "server"
run = "go test ./..."

[tasks."server-rs:prepare"]
description = "Regenerate server-rs/.sqlx after adding or changing a sqlx query (needs sqlx-cli)"
run = "bash scripts/sqlx-prepare.sh"

[tasks."server-rs:test"]
description = "Run Rust Music Server tests"
run = "cargo test -p earthly-music-server"

[tasks."server-rs:parity"]
description = "Compare the Rust Music Server's answers with the Go server's on copies of the same database"
run = "bun scripts/server-parity.ts"

[tasks."desktop:test"]
description = "Run Desktop core (Rust) and Electron shell unit tests"
run = ["bun run --cwd desktop test:core", "bun run --cwd desktop test"]

[tasks."web:test:e2e"]
description = "Run Web Client Playwright tests"
run = "bun run --cwd web test:e2e"

[tasks."server:test:hls"]
description = "Run Music Server HLS browser integration tests"
dir = "server"
env = { RUN_HLS_BROWSER_INTEGRATION = "1" }
run = "go test ./internal/modules/radio -run TestBrowserHLSProxyIntegration -count=1 -v"

[tasks."desktop:test:mpv"]
description = "Run Desktop core tests against pinned mpv"
run = ["bun run --cwd desktop prepare:mpv", "bun run --cwd desktop test:mpv"]

[tasks."desktop:test:import-parity"]
description = "Run Desktop core Managed Import parity against a real Music Server"
run = "bun run --cwd desktop test:import-parity"

# --- Security audit ----------------------------------------------------------

[tasks.audit]
description = "Check JS and Go dependencies for known vulnerabilities"
depends = ["web:audit", "server:audit"]

[tasks."web:audit"]
description = "bun audit for moderate and higher advisories"
run = "bun audit --audit-level=moderate"

[tasks."server:audit"]
description = "govulncheck for vulnerabilities reachable from Music Server code"
dir = "server"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.ci]
description = "What CI runs on every pull request: static checks, unit tests, and dependency audit"
depends = ["check", "test", "generate:check", "audit"]

[tasks."ci:integration"]
description = "Browser, HLS, and pinned-mpv integration tests"
depends = [
	"web:test:e2e",
	"server:test:hls",
	"desktop:test:mpv",
	"desktop:test:import-parity",
]
