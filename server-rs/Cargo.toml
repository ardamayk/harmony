[package]
name = "earthly-music-server"
version = "0.1.0"
description = "Earthly Audio Music Server (Rust); replaces server/ module by module, see docs/adr/0025"
edition = "2024"

[[bin]]
name = "earthly-music-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "original-uri"] }
caseless = "=0.2.2"
libsqlite3-sys = "=0.37.0"
regex = "=1.13.1"
rust-embed = { version = "=8.12.0", features = ["mime-guess"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["catch-panic", "cors", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.25"

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
