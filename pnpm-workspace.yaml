packages:
  - desktop
  - web
  - packages/*

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  browserslist: 4.28.8
  fast-uri: 3.1.9
  nanoid: 3.3.18
  postcss: 8.5.26
  postcss-selector-parser: 7.1.6
  seroval: 1.6.11
  vite: "catalog:"

# Packages whose install scripts may run.
allowBuilds:
  esbuild: true
  lightningcss: true
  # electron-builder's Squirrel.Windows maker; the Windows build uses the
  # `dir` target, so its 7-Zip selection script never needs to run.
  electron-winstaller: false
