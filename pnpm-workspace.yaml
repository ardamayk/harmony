packages:
  - desktop
  - web
  - packages/*

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  # @hey-api/openapi-ts (zod generation) pins a js-yaml with CPU-exhaustion advisories.
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  browserslist: 4.28.8
  fast-uri: 3.1.9
  nanoid: 3.3.18
  postcss: 8.5.26
  postcss-selector-parser: 7.1.6
  seroval: 1.6.11
  # @scalar/api-reference pins a vulnerable undici for its Node-only loaders;
  # the served browser bundle does not include it.
  "@scalar/json-magic>undici": 7.30.1
  vite: "catalog:"

# Packages whose install scripts may run.
allowBuilds:
  esbuild: true
  lightningcss: true
  # electron-builder's Squirrel.Windows maker; the Windows build uses the
  # `dir` target, so its 7-Zip selection script never needs to run.
  electron-winstaller: false
  # Pulled in by @scalar/api-reference; only its prebuilt browser bundle is
  # served, so the Vue 2/3 switch script never needs to run.
  vue-demi: false
