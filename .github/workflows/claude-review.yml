name: Claude Review

# Two passes on every PR: a bug review, then a security review once the bug
# review is clean. Later pushes are reviewed only from the last reviewed
# commit. Either one with open findings fails its job, so making both
# required checks blocks the merge. REVIEW.md tells both what matters and how
# to work.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

env:
  REVIEW_TOOLS: >-
    mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/compare/*),Read,Grep,Glob
  # The reviewer returns how many findings are still open; a later step fails on more than zero.
  FINDINGS_SCHEMA: '{"type":"object","properties":{"findings":{"type":"integer","description":"Verified problems still open on this PR"}},"required":["findings"]}'
  REVIEW_MODEL: claude-sonnet-5-5
  ROUND_LIMIT: 3
  ROUND_OVERRIDE: review-more-rounds

jobs:
  review:
    name: Claude bug review
    # Fork PRs cannot read the token secret.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A round is an earlier run of this workflow for this PR in which
      # Claude returned a result (its "Record review round" step ran); runs that
      # failed before that, returned nothing (for example while the workflow file
      # differs from main and the action skips itself) or stopped at the limit do
      # not count and do not move the REVIEWED UP TO baseline. A baseline the head
      # no longer descends from (after a force-push) is dropped, so the whole PR is
      # reviewed. After ROUND_LIMIT rounds the review stops and asks a person to
      # step in, so an agent author and the reviewer cannot loop; the
      # ROUND_OVERRIDE label lifts it.
      - id: rounds
        name: Count earlier review rounds
        run: |
          rounds=0
          since=
          while read -r id sha; do
            [ -n "$id" ] || continue
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "Claude bug review") | .steps[] | select(.name == "Record review round") | .conclusion' \
              | grep -qx success; then
              rounds=$((rounds + 1))
              [ -n "$since" ] || since=$sha
            fi
          done < <(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/claude-review.yml/runs" \
            -f branch="$HEAD_REF" -f event=pull_request -f status=completed -f per_page=100 \
            --jq ".workflow_runs[] | select(any(.pull_requests[]; .number == $PR)) | \"\\(.id) \\(.head_sha)\"")
          if [ -n "$since" ] && [ "$since" != "$HEAD_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$since...$HEAD_SHA" --jq .status 2>/dev/null || true)
            if [ "$status" != ahead ]; then
              echo "Baseline $since is not an ancestor of the head (${status:-unknown}); reviewing the whole PR."
              since=
            fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "round=$((rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$rounds" -lt "$ROUND_LIMIT" ]; then exit 0; fi
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx "$ROUND_OVERRIDE"; then
            echo "Round limit lifted by the $ROUND_OVERRIDE label."; exit 0
          fi
          notice="Claude bug review: round limit reached."
          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$notice"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "**$notice** This PR has had $ROUND_LIMIT review rounds. Instead of another fix-and-review round, a person should step back and rethink the approach. To allow more rounds, add the \`$ROUND_OVERRIDE\` label and push again."
          fi
          echo "::error::Review round limit ($ROUND_LIMIT) reached; a person should rethink the approach, or add the $ROUND_OVERRIDE label."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          # From `claude setup-token` (Max subscription), stored as a repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            ROUND: ${{ steps.rounds.outputs.round }}
            REVIEWED UP TO: ${{ steps.rounds.outputs.since || 'none (first round)' }}

            This is the bug pass. Read CLAUDE.md for the coding rules and REVIEW.md, then follow
            REVIEW.md's "Process", "Skip" and "Bug review" sections. Security is reviewed in a
            separate pass, so leave it out here.
          claude_args: |
            --allowedTools "${{ env.REVIEW_TOOLS }}"
            --json-schema '${{ env.FINDINGS_SCHEMA }}'
            --model ${{ env.REVIEW_MODEL }}
      # Its presence marks this run as a round for later runs' count.
      - name: Record review round
        if: steps.claude.outputs.structured_output != ''
        run: echo "Claude returned a result; this run counts as a review round."
      - name: Fail on open findings
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          n=$(jq -r '.findings // empty' <<<"$RESULT" 2>/dev/null)
          if [ -z "$n" ]; then echo "::error::The bug review returned no result."; exit 1; fi
          if [ "$n" -gt 0 ]; then echo "::error::$n open bug finding(s); fix them or reply with why they are not bugs."; exit 1; fi
          echo "No open bug findings."

  security:
    name: Claude security review
    # Runs only after a clean bug review. Each push is reviewed once: the pass looks
    # only at changes since the last clean security pass on this PR, and a head
    # already passed (a re-run, ready for review) is not reviewed again.
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The last clean pass is the newest earlier run for this PR whose "Record
      # clean security pass" step ran. A baseline the head no longer descends from
      # (after a force-push) is dropped, so the whole PR is reviewed.
      - id: since
        name: Find the last clean security pass
        run: |
          since=
          while read -r id sha; do
            [ -n "$id" ] || continue
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "Claude security review") | .steps[] | select(.name == "Record clean security pass") | .conclusion' \
              | grep -qx success; then
              since=$sha
              break
            fi
          done < <(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/claude-review.yml/runs" \
            -f branch="$HEAD_REF" -f event=pull_request -f status=completed -f per_page=100 \
            --jq ".workflow_runs[] | select(any(.pull_requests[]; .number == $PR)) | \"\\(.id) \\(.head_sha)\"")
          if [ -n "$since" ] && [ "$since" != "$HEAD_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$since...$HEAD_SHA" --jq .status 2>/dev/null || true)
            if [ "$status" != ahead ]; then
              echo "Baseline $since is not an ancestor of the head (${status:-unknown}); reviewing the whole PR."
              since=
            fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          if [ "$since" = "$HEAD_SHA" ]; then
            echo "This head already passed the security review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.since.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - id: claude
        if: steps.since.outputs.skip != 'true'
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            REVIEWED UP TO: ${{ steps.since.outputs.since || 'none (first security pass)' }}

            This is the security pass: look for vulnerabilities only, since bugs were reviewed in
            an earlier pass. Read REVIEW.md and follow its "Process", "Skip" and "Security review"
            sections.
          claude_args: |
            --allowedTools "${{ env.REVIEW_TOOLS }}"
            --json-schema '${{ env.FINDINGS_SCHEMA }}'
            --model ${{ env.REVIEW_MODEL }}
      - name: Fail on open findings
        if: steps.since.outputs.skip != 'true'
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          n=$(jq -r '.findings // empty' <<<"$RESULT" 2>/dev/null)
          if [ -z "$n" ]; then echo "::error::The security review returned no result."; exit 1; fi
          if [ "$n" -gt 0 ]; then echo "::error::$n open security finding(s); fix them or reply with why they are not exploitable."; exit 1; fi
          echo "No open security findings."
      # Its presence marks this head as the baseline for the next push's pass.
      - name: Record clean security pass
        if: steps.since.outputs.skip != 'true'
        run: echo "Security review passed at $HEAD_SHA; the next push is reviewed from here."
