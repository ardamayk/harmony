name: Claude Review

# Two passes on every PR: a bug review, then a security review once the bug
# review is clean. Each pass runs three finder and three voter agents per
# round, reviews a push from the last reviewed commit, and stops after three
# rounds (claude-review-pass.yml). Each pass's "Post" job is its result; make
# "Claude bug review / Post" and "Claude security review / Post" required
# checks to block the merge on open findings. REVIEW.md tells the agents what
# matters and how to work.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

jobs:
  bug:
    name: Claude bug review
    # Fork PRs cannot read the token secret.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/claude-review-pass.yml
    with:
      pass: bug
      label: Claude bug review
    secrets: inherit

  security:
    name: Claude security review
    needs: bug
    uses: ./.github/workflows/claude-review-pass.yml
    with:
      pass: security
      label: Claude security review
    secrets: inherit
