name: Release

# A `v*` tag publishes the Windows Desktop Client as a GitHub Release and the
# Music Server image under its version. Run by hand, it stops at the workflow
# artifact and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  server-image:
    name: Server image
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml

  windows:
    name: Windows Desktop Client
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - id: version
        run: |
          version=$(jq -r .version desktop/package.json)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json $version"
            exit 1
          fi
          echo "name=Harmony-$version-windows-x64" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: pnpm install --frozen-lockfile
      - run: mise run web:build
      # No build cache: a published package is built from this tag alone.
      - run: node scripts/desktop-windows/cli.ts build --web-built
        env:
          EARTHLY_AUDIO_WINDOWS_OUT: ${{ runner.temp }}/${{ steps.version.outputs.name }}
      - working-directory: ${{ runner.temp }}
        run: |
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
        env:
          NAME: ${{ steps.version.outputs.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ runner.temp }}/${{ steps.version.outputs.name }}.zip
            ${{ runner.temp }}/${{ steps.version.outputs.name }}.zip.sha256
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ runner.temp }}
        run: gh release create "$GITHUB_REF_NAME" "$NAME.zip" "$NAME.zip.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
