openapi: 3.0.3
info:
  title: Harmony API
  version: 0.1.0
  description: Self-hosted music server API
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: system
  - name: user
  - name: preferences
  - name: library
  - name: imports
  - name: playback
  - name: playlists
  - name: radio
  - name: external-source
    description: >-
      Search and playback through the operator-installed yt-dlp (ADR 0032).
      Advertised through the external-source.v1 capability; every route
      answers 404 external_source_disabled while EXTERNAL_SOURCE_SEARCH is
      not configured.
  - name: listen-together
    description: >-
      Rooms on the Owner's Music Server (ADR 0037). Advertised through the
      listen-together.v1 capability, only when GUEST_ADDR and PUBLIC_URL are
      configured. Opening and closing a Room exist only on the Owner's
      listener; the Guest Listener answers only the routes a Guest may use.
      There, every read a Guest session makes is rate limited, a Guest holds
      at most 4 audio streams, and a request for a further Track answers 429
      rate_limited; a request for a Track already streaming, such as a seek,
      replaces that Track's oldest stream instead. Joining has one limit
      shared by all clients.
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      tags: [user]
      operationId: getMe
      summary: Current user profile (stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: Get user preferences including layout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [preferences]
      operationId: patchPreferences
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/library/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: List artists
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Substring filter over active Album Artists only. Exact names sort first. Album counts include active Album Artist credits only.
      responses:
        "200":
          description: Artist list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistList"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/artists/{artistId}:
    get:
      tags: [library]
      operationId: getArtist
      summary: Get an artist
      description: Any credited Artist. Album counts include active Album Artist credits only.
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: Artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/artists/{artistId}/photo:
    get:
      tags: [library]
      operationId: getArtistPhoto
      summary: Get an artist photo
      description: >-
        Looked up on Deezer on first request and stored on the Music Server
        (ADR 0027), so clients never contact Deezer. Not found when Deezer has
        no photo, the lookup failed, or online lookups are switched off.
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: Artist photo
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/artists/{artistId}/biography:
    get:
      tags: [library]
      operationId: getArtistBiography
      summary: Get an artist biography
      description: >-
        The Artist's Wikipedia summary, found through MusicBrainz and Wikidata
        on first request and stored (ADR 0027). Show `sourceUrl` with it, as
        Wikipedia's CC BY-SA licence requires. Not found when there is none,
        the lookup failed, or online lookups are switched off.
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: Artist biography
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistBiography"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/artists/{artistId}/popular-tracks:
    get:
      tags: [library]
      operationId: listArtistPopularTracks
      summary: List an artist's popular tracks
      description: >-
        The Artist's Tracks in the library that are among their 50 most
        popular on Deezer, best first. The Deezer list is looked up on first
        request and refreshed weekly (ADR 0027); titles are matched without
        case or bracketed versions. Empty when there is no list, the lookup
        failed, or online lookups are switched off.
      parameters:
        - $ref: "#/components/parameters/artistId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Popular tracks, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularTrackList"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks/play-counts:
    get:
      tags: [library]
      operationId: listTrackPlayCounts
      summary: List Last.fm play counts for tracks
      description: >-
        Last.fm play counts for the named Tracks, read from their first
        credited Artist's 1000 most played Tracks on Last.fm, matched without
        case or bracketed versions and refreshed weekly (ADR 0030). Only when
        the operator set LASTFM_API_KEY; Tracks without a count are left out,
        so the list is empty without a key.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated Track ids, at most 200.
          schema:
            type: string
      responses:
        "200":
          description: Play counts for the Tracks that have one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayCountList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: List albums
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: artistId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search by title
      responses:
        "200":
          description: Album list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumList"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/albums/{albumId}/online-genres:
    get:
      tags: [library]
      operationId: listAlbumOnlineGenres
      summary: List Deezer's genres for an album whose tags name none
      description: >-
        Deezer's genres for the Album, looked up on first request and stored
        (ADR 0027). Shown on the Album page only; Genre pages, filters and
        radio still read the tags. Empty when the Album's tags name a genre,
        when Deezer has none, or when online lookups are off.
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Genre names, Deezer's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreNameList"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/albums/{albumId}:
    get:
      tags: [library]
      operationId: getAlbum
      summary: Get album with tracks
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [library]
      operationId: deleteAlbum
      summary: Permanently delete every Managed Track of an Album after reviewing the album deletion preview
      description: >-
        Runs one Permanent Track Deletion per Track in album order. Each Track
        commits on its own: a failure stops the run, Tracks already deleted stay
        deleted, and the result lists both outcomes. The Album and its artwork
        disappear with their last Track.
      parameters:
        - $ref: "#/components/parameters/albumId"
        - name: X-Permanent-Delete
          in: header
          required: true
          description: Explicit application confirmation required for irreversible deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackDeletionConfirmation"
      responses:
        "200":
          description: Per-Track outcome of the album deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDeletionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/albums/{albumId}/deletion:
    get:
      tags: [library]
      operationId: previewAlbumDeletion
      summary: Review the irreversible deletion of every Managed Track of an Album and all affected references
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Current album deletion preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDeletionPreview"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/albums/{albumId}/cover:
    get:
      tags: [library]
      operationId: getAlbumCover
      summary: Get album cover image
      parameters:
        - $ref: "#/components/parameters/albumId"
        - name: size
          in: query
          required: false
          description: >-
            Longest edge in pixels. The cover is scaled down to fit (never up)
            and served as JPEG; a cover already within the size is served as
            is. Omit for the original image.
          schema:
            type: integer
            enum: [64, 128, 256, 512, 1024]
      responses:
        "200":
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: List or search tracks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: artistId
          in: query
          description: Exact Track or Album Artist credit filter, combined with q before counting and pagination.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search by title or artist
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks/{trackId}:
    get:
      tags: [library]
      operationId: getTrack
      summary: Get track metadata
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [library]
      operationId: deleteTrack
      summary: Permanently delete a Managed Track after reviewing its deletion preview
      parameters:
        - $ref: "#/components/parameters/trackId"
        - name: X-Permanent-Delete
          in: header
          required: true
          description: Explicit application confirmation required for irreversible deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackDeletionConfirmation"
      responses:
        "200":
          description: Managed Track and its exact managed audio file permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/search:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: Library Search across Tracks, Albums, Artists, Genres, and Playlists
      description: >-
        Evaluates one coherent Library Search on the Music Server: every query
        word must match and at least one word must contribute to the result's
        own title/name. Related metadata may complete mixed queries but never
        adds unrelated Albums or Artists. Bounded typo correction applies only
        when no strong direct result exists. Groups hold at most five records
        each unless all=true returns every ranked result. Ranking and Best Match
        selection are unchanged; the Best Match also appears first in its group.
      parameters:
        - name: q
          in: query
          required: true
          description: The query text; empty and punctuation-only input is rejected
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: all
          in: query
          required: false
          description: Return all ranked results instead of five per group; must be true or false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Ranked Library Search groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks/{trackId}/lyrics:
    get:
      tags: [library]
      operationId: getTrackLyrics
      summary: Get a track's lyrics
      description: >-
        The lyrics read from the file tags at import; when the file carried
        none, LRCLIB's for the Track's title, Artist, Album and duration,
        looked up on first request and stored (ADR 0029). Synced lyrics come
        as LRC text. Empty when there are none, the lookup failed, or online
        lookups are switched off.
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackLyrics"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks/{trackId}/waveform:
    get:
      tags: [library]
      operationId: getTrackWaveform
      summary: Get normalized waveform peaks for a track
      description: >-
        Peaks are decoded from the managed file with ffmpeg on first request
        and cached; a replaced file is decoded again. Advertised through the
        track-waveform.v1 capability, which requires ffmpeg on the Music Server.
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Cached waveform peaks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackWaveform"
        "202":
          description: Peaks are still being generated; retry after the given delay.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackWaveformPending"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: ffmpeg is not installed on the Music Server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/library/tracks/{trackId}/deletion:
    get:
      tags: [library]
      operationId: previewTrackDeletion
      summary: Review irreversible Managed Track deletion and all affected references
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Current Permanent Track Deletion preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackDeletionPreview"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks/{trackId}/replacement:
    post:
      tags: [library]
      operationId: createTrackReplacement
      summary: Start an explicit Track Replacement for one Managed Track
      description: >-
        Creates a Managed Import Job bound to the Track. Upload the replacement file
        with uploadManagedImportFile; the returned Import Preview carries a
        replacement section listing every difference and destructive consequence.
        Confirm with confirmTrackReplacement, never with confirmManagedImport.
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "201":
          description: Track Replacement job created and awaiting the replacement upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/import-batches:
    post:
      tags: [imports]
      operationId: createManagedImportBatch
      summary: Create one multi-file Managed Import Batch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportBatchCreate"
      responses:
        "201":
          description: Managed Import Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
  /api/v1/import-history:
    get:
      tags: [imports]
      operationId: listImportHistory
      summary: List up to 20 most recent terminal Managed Import results
      responses:
        "200":
          description: Recent terminal Import History without staged audio or raw metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportHistoryList"
  /api/v1/import-batches/{batchId}:
    get:
      tags: [imports]
      operationId: getManagedImportBatch
      summary: Get per-file preview, progress, selection, and outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "200":
          description: Current Managed Import Batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [imports]
      operationId: cancelManagedImportBatch
      summary: Cancel an uncommitted Managed Import Batch and remove its staging
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "204":
          description: Managed Import Batch canceled and staging removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/import-batches/{batchId}/heartbeat:
    post:
      tags: [imports]
      operationId: heartbeatManagedImportBatch
      summary: Keep an unfinished import alive without changing its preview revision
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "204":
          description: Client liveness recorded
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import-batches/{batchId}/albums/{albumKey}/artwork:
    parameters:
      - $ref: "#/components/parameters/batchId"
      - name: albumKey
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: uploadManagedImportArtwork
      summary: Stage a JPEG or PNG cover for an import Album
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Validated artwork option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportArtworkOption"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/import-batches/{batchId}/artwork/{artworkId}:
    parameters:
      - $ref: "#/components/parameters/batchId"
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getManagedImportArtwork
      summary: Preview staged Album artwork
      responses:
        "200":
          description: Validated image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import-batches/{batchId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImportBatch
      summary: Commit selected accepted files independently and return all outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportBatchConfirmation"
      responses:
        "200":
          description: Terminal per-file Import Batch report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports:
    post:
      tags: [imports]
      operationId: createManagedImportJob
      summary: Create one server-owned Managed Import Job
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportJobCreate"
      responses:
        "201":
          description: Managed Import Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
  /api/v1/imports/{importId}:
    get:
      tags: [imports]
      operationId: getManagedImportJob
      summary: Observe Managed Import validation progress and terminal result
      parameters:
        - $ref: "#/components/parameters/importId"
      responses:
        "200":
          description: Current Managed Import Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [imports]
      operationId: cancelManagedImport
      summary: Cancel an uncommitted Managed Import Job and remove its staging
      parameters:
        - $ref: "#/components/parameters/importId"
      responses:
        "204":
          description: Managed Import Job canceled and staging removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports/{importId}/file:
    put:
      tags: [imports]
      operationId: uploadManagedImportFile
      summary: Stream one audio file into a Managed Import Job and detect its actual format
      parameters:
        - $ref: "#/components/parameters/importId"
        - name: X-Import-Filename
          in: header
          required: true
          schema:
            type: string
          description: Display-only client filename; never used as a storage path.
        - name: X-Import-Filename-Encoding
          in: header
          required: false
          schema:
            type: string
            enum: [url]
          description: >-
            Set to url when X-Import-Filename is percent-encoded so non-ASCII
            filenames survive HTTP header transport. Absent means the header is
            sent verbatim.
      description: >-
        The request media type is advisory only. The Music Server detects the
        Source Audio Format from the uploaded bytes and never trusts the
        declared Content-Type or the client filename extension.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          audio/flac:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/opus:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import Preview ready for confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: Upload stream was interrupted and this Import Job remains retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: File or batch exceeds the configured Managed Import byte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: File fails the Strict Import Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/imports/{importId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImport
      summary: Confirm an Import Preview and commit its Managed Track
      parameters:
        - $ref: "#/components/parameters/importId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportConfirmation"
      responses:
        "200":
          description: Managed Track committed, or the idempotent prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/imports/{importId}/replacement:
    post:
      tags: [imports]
      operationId: confirmTrackReplacement
      summary: Confirm a reviewed Track Replacement and delete the previous managed file
      description: >-
        Keeps the Track ID and every Playlist and Queue reference, makes the validated
        replacement metadata authoritative, cleans emptied Albums and Artists, and
        deletes the previous managed file only after the replacement was placed,
        hashed, committed, and read back from its Canonical Library Path.
      parameters:
        - $ref: "#/components/parameters/importId"
        - name: X-Track-Replacement
          in: header
          required: true
          description: Explicit application confirmation required for the irreversible old-file deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackReplacementConfirmation"
      responses:
        "200":
          description: Track Replacement committed, or the idempotent prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackReplacementResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Replacement file no longer passes the Strict Import Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
