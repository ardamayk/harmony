      summary: Check External Track audio availability without downloading it
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
      responses:
        "200":
          description: External Track audio is available
        "206":
          description: Partial content (Range request)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "422":
          $ref: "#/components/responses/ExternalTrackUnplayable"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "503":
          $ref: "#/components/responses/ExternalSourceUnavailable"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
    get:
      tags: [external-source]
      operationId: streamExternalTrack
      summary: Stream progressive External Track audio through the Music Server
      description: >-
        Proxies the resolved progressive audio. A Range request is passed
        upstream and answered with 206; Content-Type (media types only,
        otherwise application/octet-stream), Content-Range, Accept-Ranges,
        and Content-Length are copied. An HLS External Track answers 422;
        play it from /playlist.m3u8 instead.
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
      responses:
        "200":
          description: Full audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (Range request)
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "422":
          $ref: "#/components/responses/ExternalTrackUnplayable"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "503":
          $ref: "#/components/responses/ExternalSourceUnavailable"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
  /api/v1/external/tracks/{externalTrackId}/playlist.m3u8:
    get:
      tags: [external-source]
      operationId: getExternalTrackPlaylist
      summary: Get an HLS External Track's playlist through the Music Server
      description: >-
        The upstream HLS playlist, rewritten so every media playlist, segment,
        and key URL points back to this Music Server as a signed
        /resources/{resource} URL, like the radio HLS proxy. A progressive
        External Track answers 422; stream it from /stream instead. A
        DRM-protected playlist answers 422 external_track_unplayable too,
        where the radio HLS proxy answers 415.
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
      responses:
        "200":
          description: Rewritten HLS playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "422":
          $ref: "#/components/responses/ExternalTrackUnplayable"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "503":
          $ref: "#/components/responses/ExternalSourceUnavailable"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
  /api/v1/external/tracks/{externalTrackId}/resources/{resource}:
    get:
      tags: [external-source]
      operationId: getExternalTrackResource
      summary: Get one HLS media playlist, segment, or key of an External Track
      description: >-
        Only reachable through URLs emitted by a rewritten External Track
        playlist; the resource token is signed for this External Track and
        process. Nested media playlists are rewritten the same way; a
        DRM-protected one answers 422 external_track_unplayable.
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
        - name: resource
          in: path
          required: true
          description: Signed HLS resource token emitted by a proxied playlist
          schema:
            type: string
      responses:
        "200":
          description: HLS media playlist, segment, or key
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial HLS media resource
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "422":
          $ref: "#/components/responses/ExternalTrackUnplayable"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
  /api/v1/external/tracks/{externalTrackId}/artwork:
    get:
      tags: [external-source]
      operationId: getExternalTrackArtwork
      summary: Get an External Track's cover image through the Music Server
      description: >-
        Fetches the one cover image the search chose for the External Track
        (hasArtwork true): only the public HTTPS URL signed into its id, with
        the stream proxy's address checks on every redirect. The image is
        served as JPEG, PNG, or WebP of at most 2 MiB; anything else answers
        502. Clients load it from here because they never contact the
        External Source's sites themselves.
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
      responses:
        "200":
          description: Cover image
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=3600
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalTrackArtworkNotFound"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
  /api/v1/listen-together/session:
    get:
      tags: [listen-together]
      operationId: getListenTogetherSession
      summary: Who this client is to Listen Together
      description: >-
        Owner on the Owner's listener. On the Guest Listener, guest with a live
        Guest session and none without one.
      responses:
        "200":
          description: The client's role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherSession"
  /api/v1/listen-together/join:
    post:
      tags: [listen-together]
      operationId: joinListenTogetherRoom
      summary: Exchange an Invite Link token for a Guest session
      description: >-
        Only on the Guest Listener. Sets the Guest session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenTogetherJoinRequest"
      responses:
        "200":
          description: Joined; the Guest session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The Invite Link is invalid, expired or revoked (invite_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The Room already holds its Guest limit (room_full)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/listen-together/leave:
    post:
      tags: [listen-together]
      operationId: leaveListenTogetherRoom
      summary: End this Guest session and free its place
      description: >-
        Only on the Guest Listener.
      responses:
        "204":
          description: Left; the Guest session cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/listen-together/room:
    get:
      tags: [listen-together]
      operationId: getListenTogetherRoom
      summary: Current Room State
      responses:
        "200":
          description: The open Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [listen-together]
      operationId: openListenTogetherRoom
      summary: Open the Room
      description: Owner only. A Personal Music Server has one Room at a time.
      responses:
        "201":
          description: The new Room, with its Invite Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherRoom"
        "404":
          description: Listen Together is not configured (listen_together_disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [listen-together]
      operationId: closeListenTogetherRoom
      summary: Close the Room and revoke its Invite Link and Guest sessions
      description: Owner only.
      responses:
        "204":
          description: Closed
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/listen-together/room/commands:
    post:
      tags: [listen-together]
      operationId: sendListenTogetherCommand
      summary: Change the Room State
      description: >-
        The last command to reach the Music Server wins. A skip carrying a
        fromTrackId or fromIndex that is no longer current changes nothing, so every client
        may report the end of a Track. A playTracks naming a Track outside
        the library answers 400 with field trackIds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenTogetherCommand"
      responses:
        "200":
          description: The Room State after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many commands from this client (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/listen-together/room/events:
    get:
      tags: [listen-together]
      operationId: streamListenTogetherRoomEvents
      summary: Stream Room State snapshots
      description: >-
        Emits a room-state event with the full Room State on connecting and
        after every change, and room-closed once, with an empty JSON object
        as its data, when the Room ends. A Guest whose stream stays
        disconnected for 60 seconds loses their session and their place.
      responses:
        "200":
          description: Room event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ListenTogetherRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/listen-together/room/clock:
    get:
      tags: [listen-together]
      operationId: getListenTogetherClock
      summary: Read the Music Server's clock
      responses:
        "200":
          description: The server time, for estimating the clock offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTogetherClock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >-
        Only on the Guest Listener. Too many requests from this Guest, or too
        many join attempts from everyone (rate_limited)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientStorage:
      description: Managed Storage cannot satisfy the configured reserve and temporary-space requirements
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RangeNotSatisfiable:
      description: Range not satisfiable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalSourceDisabled:
      description: >-
        The External Source is not configured on this Music Server
        (code external_source_disabled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalTrackArtworkNotFound:
      description: >-
        The External Source is not configured (code
        external_source_disabled), or the External Track has no artwork
        (code external_track_artwork_missing).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalTrackUnplayable:
      description: >-
        The External Track has no usable audio: no http(s) audio format, DRM,
        or a live stream; also a progressive route asked for an HLS External
        Track or the other way round (code external_track_unplayable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalSourceFailed:
      description: >-
        yt-dlp exited with an error or printed unparseable output, or the
        upstream audio or artwork request failed (code
        external_source_failed). The message carries yt-dlp's last ERROR
        line when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalSourceUnavailable:
      description: >-
        yt-dlp is not installed or could not be started on the Music Server
        (code external_source_unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalSourceTimeout:
      description: >-
        yt-dlp did not finish in time: 20 seconds for a search, 30 seconds
        for resolving an External Track; or an External Track's artwork did
        not arrive within 15 seconds (code external_source_timeout).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    artistId:
      name: artistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    albumId:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    importId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    queueItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    playlistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    externalTrackId:
      name: externalTrackId
      in: path
      required: true
      description: Opaque External Track id from searchExternalSource
      schema:
        type: string
        maxLength: 2048
        pattern: "^[A-Za-z0-9_.-]+$"
  schemas:
    ListenTogetherSession:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, guest, none]
    ListenTogetherJoinRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    ListenTogetherClock:
      type: object
      required: [serverTimeMs]
      properties:
        serverTimeMs:
          type: integer
          format: int64
    ListenTogetherRoom:
      type: object
      description: >-
        One full snapshot of the Room State. While playing, the expected
        playhead is positionMs plus the time since positionAtMs.
      required:
        - revision
        - trackIds
        - currentIndex
        - playing
        - positionMs
        - positionAtMs
        - lyricsOpen
        - guestCount
        - maxGuests
        - expiresAt
      properties:
        revision:
          type: integer
          format: int64
          description: Rises with every change; clients ignore older snapshots.
        trackIds:
          type: array
          description: The Room Queue.
          items:
            type: string
            format: uuid
        currentIndex:
          type: integer
          nullable: true
          minimum: 0
          description: The current Track in trackIds; null before the first play.
        playing:
          type: boolean
        positionMs:
          type: integer
          format: int64
          minimum: 0
        positionAtMs:
          type: integer
          format: int64
          description: Server time at which positionMs was true.
        lyricsOpen:
          type: boolean
        guestCount:
          type: integer
          minimum: 0
        maxGuests:
          type: integer
          minimum: 1
          maximum: 8
        expiresAt:
          type: string
          format: date-time
        inviteUrl:
          type: string
          format: uri
          description: The Invite Link, only in the Owner's responses.
    ListenTogetherCommand:
      oneOf:
        - $ref: "#/components/schemas/ListenTogetherPlayTracksCommand"
        - $ref: "#/components/schemas/ListenTogetherResumeCommand"
        - $ref: "#/components/schemas/ListenTogetherPauseCommand"
        - $ref: "#/components/schemas/ListenTogetherSeekCommand"
        - $ref: "#/components/schemas/ListenTogetherSkipCommand"
        - $ref: "#/components/schemas/ListenTogetherSetLyricsOpenCommand"
      discriminator:
        propertyName: type
        mapping:
          playTracks: "#/components/schemas/ListenTogetherPlayTracksCommand"
          resume: "#/components/schemas/ListenTogetherResumeCommand"
          pause: "#/components/schemas/ListenTogetherPauseCommand"
          seek: "#/components/schemas/ListenTogetherSeekCommand"
          skip: "#/components/schemas/ListenTogetherSkipCommand"
          setLyricsOpen: "#/components/schemas/ListenTogetherSetLyricsOpenCommand"
    ListenTogetherPlayTracksCommand:
      type: object
      description: Replaces the Room Queue and plays from index.
      required: [type, trackIds, index]
      properties:
        type:
          type: string
          enum: [playTracks]
        trackIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        index:
          type: integer
          minimum: 0
    ListenTogetherResumeCommand:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [resume]
    ListenTogetherPauseCommand:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [pause]
    ListenTogetherSeekCommand:
      type: object
      required: [type, positionMs]
      properties:
        type:
          type: string
          enum: [seek]
        positionMs:
          type: integer
          format: int64
          minimum: 0
    ListenTogetherSkipCommand:
      type: object
      required: [type, direction]
      properties:
        type:
          type: string
          enum: [skip]
        direction:
          type: string
          enum: [next, previous]
        fromTrackId:
          type: string
          format: uuid
          description: When set, the skip applies only if this is still the current Track.
        fromIndex:
          type: integer
          minimum: 0
          description: >-
            When set, the skip applies only if the Room is still at this
            position, since a Room Queue can hold one Track twice in a row.
    ListenTogetherSetLyricsOpenCommand:
      type: object
      required: [type, open]
      properties:
        type:
          type: string
          enum: [setLyricsOpen]
        open:
          type: boolean
    HealthResponse:
      type: object
      required: [status, version, capabilities, dependencies]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Named server behaviors supported by this release. The versioned
            /api/v1 surface itself is advertised as api.v1. Queue event streaming
            is advertised as playback.queue-events.v1 and the first strict FLAC
            Managed Import tracer bullet as managed-import.v1. Multi-file Managed
            Import Batches are advertised as managed-import-batches.v1, Permanent
            Track Deletion as managed-track-deletion.v1, explicit Track
            Replacement as managed-track-replacement.v1, Album deletion
            (one Permanent Track Deletion per Track, previewed once) as
            managed-album-deletion.v1, lazily generated waveform peaks as
            track-waveform.v1 (only when ffmpeg is installed), and External
            Source search and playback through yt-dlp as external-source.v1
            (only when EXTERNAL_SOURCE_SEARCH is configured; a missing yt-dlp
            shows in dependencies and answers 503), and Rooms as
            listen-together.v1 (only when GUEST_ADDR and PUBLIC_URL are
            configured). On the Guest Listener, health lists only api.v1,
            listen-together.v1 and track-waveform.v1, with empty dependencies
            and no externalSource. Clients gate optional
            behavior on the exact capability name and must ignore unknown
            entries so newer servers stay compatible with older clients.
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ServerDependency"
          description: >-
            Server Dependencies probed once at startup, in a stable order
            (ffmpeg, ffprobe, then the optional yt-dlp only when
            EXTERNAL_SOURCE_SEARCH is configured). They describe the deployment environment
            so an operator can see what the installation supports.
        externalSource:
          $ref: "#/components/schemas/ExternalSourceInfo"
    ExternalSourceInfo:
      type: object
      required: [name]
      description: >-
        The External Source the operator configured (ADR 0032). Present only
        when external-source.v1 is advertised.
      properties:
        name:
          type: string
          description: >-
            The site's name for display, such as SoundCloud: EXTERNAL_SOURCE_NAME,
            else the name of a known yt-dlp search prefix, else External.
    ServerDependency:
      type: object
      required: [name, required, available]
      properties:
        name:
          type: string
          description: Program name as invoked by the Music Server.
        required:
          type: boolean
          description: >-
            True when Managed Import cannot work without the program; false for
            an optional dependency whose absence only disables a feature.
        available:
          type: boolean
          description: True when the program was found on PATH at startup.
        version:
          type: string
          description: >-
            Version parsed from the program's own version output. Absent when
            the program is missing or its output could not be parsed.
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    LayoutPreferences:
      type: object
      required: [sidebarPosition, panels, collapsed]
      properties:
        sidebarPosition:
          type: string
          enum: [left, right]
        panels:
          type: object
          required: [left, right]
          properties:
            left:
              type: array
              items:
                type: string
            right:
              type: array
              items:
                type: string
        collapsed:
          type: object
          required: [left, right]
          properties:
            left:
              type: boolean
            right:
              type: boolean
        sizes:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Panel widths as percentages [left, main, right]
    ThemePreferences:
      type: object
      required: [mode, preset]
      properties:
        mode:
          type: string
          enum: [light, dark, system]
        preset:
          type: string
          enum:
            - earthly
            - tokyo-night
            - vintage-harbor
            - night-ember
            - dusty-earth
            - coastal-mist
            - sage-hearth
            - charcoal-coral
            - noir-red
    PlaybackPreferences:
      type: object
      description: Player Bar behaviour shared by the Web and Desktop Clients.
      required:
        - seekStepSeconds
        - seekStepLargeSeconds
        - playbackRate
        - transitionFadeMs
        - showWaveform
        - accentFromCover
        - showUpNext
        - autoSkipOnErrorSeconds
        - hoverTimestamp
      properties:
        seekStepSeconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Seconds moved by the arrow-key seek shortcut.
        seekStepLargeSeconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Seconds moved by the Shift+arrow seek shortcut.
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 2
          description: Default playback speed multiplier.
        transitionFadeMs:
          type: integer
          minimum: 0
          maximum: 2000
          description: Volume ramp applied on user-initiated transitions; 0 disables it.
        showWaveform:
          type: boolean
        accentFromCover:
          type: boolean
          description: Tint the Player Bar from the current album cover.
        showUpNext:
          type: boolean
          description: Show the next queued track beside the now-playing info.
        autoSkipOnErrorSeconds:
          type: integer
          minimum: 0
          maximum: 60
          description: Countdown before a failed track is skipped; 0 waits for the user.
        hoverTimestamp:
          type: boolean
          description: Show the hovered position as a timestamp over the seek bar.
    PlaybackPreferencesPatch:
      type: object
      description: Sparse form of PlaybackPreferences; absent fields are left unchanged.
      properties:
        seekStepSeconds:
          type: integer
          minimum: 1
          maximum: 120
        seekStepLargeSeconds:
          type: integer
          minimum: 1
          maximum: 120
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 2
        transitionFadeMs:
          type: integer
          minimum: 0
          maximum: 2000
        showWaveform:
          type: boolean
        accentFromCover:
          type: boolean
        showUpNext:
          type: boolean
        autoSkipOnErrorSeconds:
          type: integer
          minimum: 0
          maximum: 60
        hoverTimestamp:
          type: boolean
    UserPreferences:
      type: object
      required: [theme, layout, playback]
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
        playback:
          $ref: "#/components/schemas/PlaybackPreferences"
    UserPreferencesPatch:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
        playback:
          $ref: "#/components/schemas/PlaybackPreferencesPatch"
    ValidationIssue:
      type: object
      required: [code, field, reason]
      properties:
        code:
          type: string
        field:
          type: string
        reason:
          type: string
          description: Safe, actionable description of one validation failure.
    ErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        issues:
          type: array
          description: All independently detectable validation failures, in check order.
          items:
            $ref: "#/components/schemas/ValidationIssue"
        error:
          type: string
        code:
          type: string
        message:
          type: string
        field:
          type: string
          description: Machine-readable field associated with a structured validation failure.
        reason:
          type: string
          description: Actionable reason for a structured validation failure.
    ManagedImportJob:
      type: object
      required: [id, status, revision, validationProgress]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        errorCode:
          type: string
          description: Stable failure code when status is failed.
        trackId:
          type: string
          format: uuid
          description: Created or replaced Track when status is committed.
        replacesTrackId:
          type: string
          format: uuid
          description: Present when this job is an explicit Track Replacement of that Track.
    ManagedImportJobCreate:
      type: object
      required: [batchId, clientFileId]
      properties:
        batchId:
          type: string
          format: uuid
          description: Import Batch that owns this per-file job.
        clientFileId:
          type: string
          format: uuid
          description: Client-generated identifier used to correlate a Batch file when the create response is lost.
    ManagedImportBatchCreate:
      type: object
      properties:
    ManagedImportBatch:
      type: object
      required: [id, status, revision, files]
      properties:
        albums:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportAlbumPreview"
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, confirming, completed]
        revision:
          type: integer
          minimum: 1
        files:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportBatchFile"
    ManagedImportBatchFile:
      type: object
      required: [jobId, state, status, revision, validationProgress, selected]
      properties:
        phase:
          type: string
          enum: [queued, uploading, validating, ready, failed, committing, completed]
          description: Current server processing phase, separate from byte transfer progress.
        transferredBytes:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0

        issues:
          type: array
          description: All independently detectable validation failures, in check order.
          items:
            $ref: "#/components/schemas/ValidationIssue"
        jobId:
          type: string
          format: uuid
        clientFileId:
          type: string
          format: uuid
        state:
          type: string
          enum: [accepted, rejected, unresolved, completed]
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        originalFilename:
          type: string
        selected:
          type: boolean
        preview:
          $ref: "#/components/schemas/ManagedImportPreview"
        errorCode:
          type: string
        errorField:
          type: string
        errorReason:
          type: string
        outcome:
          type: string
          enum: [imported, rejected, failed, replaced, not_attempted]
        trackId:
          type: string
          format: uuid
    ManagedImportHistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ManagedImportHistoryItem"
    ManagedImportHistoryItem:
      type: object
      required: [importId, startedAt, completedAt, resultCode, counts, files]
      properties:
        importId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        resultCode:
          type: string
          enum: [completed, partially_completed, failed, canceled]
        counts:
          $ref: "#/components/schemas/ManagedImportHistoryCounts"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportHistoryFile"
    ManagedImportHistoryCounts:
      type: object
      required: [total, imported, rejected, failed, replaced, notAttempted, canceled]
      properties:
        total:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        replaced:
          type: integer
          minimum: 0
        notAttempted:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
    ManagedImportHistoryFile:
      type: object
      required: [fileId, jobId, startedAt, completedAt, resultCode]
      properties:
        issues:
          type: array
          description: All independently detectable validation failures, in check order.
          items:
            $ref: "#/components/schemas/ValidationIssue"
        fileId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        safeFilename:
          type: string
          maxLength: 255
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        resultCode:
          type: string
          minLength: 1
        createdTrackId:
          type: string
          format: uuid
        replacedTrackId:
          type: string
    ManagedImportAlbumPreview:
      type: object
      required: [key, title, albumArtists, existingAlbums, artworks]
      properties:
        key:
          type: string
        title:
          type: string
        albumArtists:
          type: array
          items:
            type: string
        existingAlbums:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportAlbumMatch"
        artworks:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportArtworkOption"
    ManagedImportAlbumMatch:
      type: object
      required: [id, hasArtwork, tracks]
      properties:
        id:
          type: string
        year:
          type: integer
        hasArtwork:
          type: boolean
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateCandidate"
    ManagedImportArtworkOption:
      type: object
      required: [id, mediaType, contentSha256]
      properties:
        id:
          type: string
        jobId:
          type: string
        mediaType:
          type: string
        contentSha256:
          type: string
    ManagedImportAlbumDecision:
      type: object
      required: [albumKey, createSeparate, artworkMode]
      properties:
        albumKey:
          type: string
        albumId:
          type: string
        createSeparate:
          type: boolean
        artworkId:
          type: string
        artworkMode:
          type: string
          enum: [auto, none, selected]
    ManagedImportBatchConfirmation:
      type: object
      required: [revision, selectedFileIds]
      properties:
        albumDecisions:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportAlbumDecision"
        revision:
          type: integer
          minimum: 1
        selectedFileIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        duplicateDecisions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateDecision"
    ManagedImportDuplicateDecision:
      type: object
      required: [jobId, action]
      properties:
        targetRevision:
          type: integer
          minimum: 1
        trackId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        action:
          type: string
          enum: [import_separately, replace_existing, do_not_import]
    ManagedImportPreview:
      type: object
      required: [jobId, status, revision, file, duplicateClassification]
      properties:
        matchingTracks:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateCandidate"
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [awaiting_confirmation, failed]
        revision:
          type: integer
          minimum: 1
        file:
          $ref: "#/components/schemas/ManagedImportPreviewFile"
        duplicateClassification:
          type: string
          enum: [none, exact_duplicate]
          description: Only identical full-file SHA-256 values are duplicates.
        duplicateCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateCandidate"
        replacement:
          $ref: "#/components/schemas/TrackReplacementPreview"
    ManagedImportDuplicateCandidate:
      type: object
      required: [trackId, title, artists, album, discNo, trackNo, format, durationMs]
      properties:
        revision:
          type: integer
          minimum: 1
        titleKey:
          type: string
        currentFile:
          $ref: "#/components/schemas/ManagedImportPreviewFile"
        trackId:
          type: string
          format: uuid
        title:
          type: string
        artists:
          type: array
          minItems: 1
          items:
            type: string
        album:
          type: string
        discNo:
          type: integer
          minimum: 1
        trackNo:
          type: integer
          minimum: 1
        format:
          type: string
        durationMs:
          type: integer
          minimum: 1
    ManagedImportPreviewFile:
      oneOf:
        - $ref: "#/components/schemas/ManagedImportFlacPreviewFile"
        - $ref: "#/components/schemas/ManagedImportWavPreviewFile"
        - $ref: "#/components/schemas/ManagedImportM4aPreviewFile"
        - $ref: "#/components/schemas/ManagedImportMp3PreviewFile"
        - $ref: "#/components/schemas/ManagedImportOggPreviewFile"
        - $ref: "#/components/schemas/ManagedImportOpusPreviewFile"
      discriminator:
        propertyName: format
        mapping:
          flac: "#/components/schemas/ManagedImportFlacPreviewFile"
          wav: "#/components/schemas/ManagedImportWavPreviewFile"
          m4a: "#/components/schemas/ManagedImportM4aPreviewFile"
          mp3: "#/components/schemas/ManagedImportMp3PreviewFile"
          ogg: "#/components/schemas/ManagedImportOggPreviewFile"
          opus: "#/components/schemas/ManagedImportOpusPreviewFile"
    ManagedImportPreviewFileCommon:
      type: object
      required:
        - originalFilename
        - title
        - artists
        - albumArtists
        - album
        - genres
        - trackNo
        - discNo
        - durationMs
        - sampleRateHz
        - channelCount
        - bitrateKbps
        - artworkMediaType
      properties:
        hasDiscNumber:
          type: boolean
        titleKey:
          type: string
        albumKey:
          type: string
        contentSha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
        artworkWarning:
          type: string
        originalFilename:
          type: string
        title:
          type: string
        artists:
          type: array
          minItems: 1
          items:
            type: string
        albumArtists:
          type: array
          minItems: 1
          items:
            type: string
        album:
          type: string
        genres:
          type: array
          nullable: true
          description: Null when the file names no genre.
          items:
            type: string
        trackNo:
          type: integer
          minimum: 1
        trackTotal:
          type: integer
          minimum: 1
        discNo:
          type: integer
          minimum: 1
        discTotal:
          type: integer
          minimum: 1
        year:
          type: integer
        durationMs:
          type: integer
          minimum: 1
        sampleRateHz:
          type: integer
          minimum: 1
        channelCount:
          type: integer
          minimum: 1
        bitrateKbps:
          type: integer
          minimum: 1
        artworkMediaType:
          type: string
          enum: ["", image/jpeg, image/png, image/webp]
    ManagedImportFlacPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec, bitDepth]
          properties:
            format:
              type: string
              enum: [flac]
            container:
              type: string
              enum: [flac]
            codec:
              type: string
              enum: [flac]
            bitDepth:
              type: integer
              minimum: 1
    ManagedImportWavPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec, bitDepth]
          properties:
            format:
              type: string
              enum: [wav]
            container:
              type: string
              enum: [wav]
            codec:
              type: string
              enum: ["pcm_u8", "pcm_s16le", "pcm_s24le", "pcm_s32le"]
            bitDepth:
              type: integer
              enum: [8, 16, 24, 32]
    ManagedImportM4aPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              enum: [m4a]
            container:
              type: string
              enum: [m4a]
            codec:
              type: string
              enum: [aac, alac]
            bitDepth:
              type: integer
              minimum: 1
              description: >-
                Source bit depth, present only for lossless ALAC. Lossy AAC
                previews omit the field because no source bit depth exists.
    ManagedImportMp3PreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              enum: [mp3]
            container:
              type: string
              enum: [mp3]
            codec:
              type: string
              enum: [mp3]
    ManagedImportOggPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              enum: [ogg]
            container:
              type: string
              enum: [ogg]
            codec:
              type: string
              enum: [vorbis]
    ManagedImportOpusPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              enum: [opus]
            container:
              type: string
              enum: [ogg]
            codec:
              type: string
              enum: [opus]
    ManagedImportConfirmation:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        duplicateDecision:
          type: string
          enum: [import_separately, replace_existing, do_not_import]
    ManagedImportResult:
      type: object
      required: [jobId, status, revision, trackId]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [committed]
        revision:
          type: integer
          minimum: 1
        trackId:
          type: string
          format: uuid
    Artist:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        albumCount:
          type: integer
    ArtistCredit:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Genre:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ReleaseIdentifier:
      type: object
      required: [scheme, value]
      properties:
        scheme:
          type: string
        value:
          type: string
    AlbumArtwork:
      type: object
      required: [contentSha256, sizeBytes]
      properties:
        sourceTrackId:
          type: string
          format: uuid
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mediaType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
    ArtistBiography:
      type: object
      required: [text, sourceUrl]
      properties:
        text:
          type: string
        sourceUrl:
          type: string
          format: uri
    GenreNameList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    PlayCountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [trackId, playCount]
            properties:
              trackId:
                type: string
              playCount:
                type: integer
                format: int64
    PopularTrackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
    ArtistList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        total:
          type: integer
    Album:
      type: object
      required: [id, title, artistId, artistName]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artistId:
          type: string
        artistName:
          type: string
        albumArtists:
          type: array
          description: Ordered normalized Album Artist credits.
          items:
            $ref: "#/components/schemas/ArtistCredit"
        year:
          type: integer
        releaseDate:
          type: string
          description: Known release date or year for this Album edition.
        releaseIdentifiers:
          type: array
          description: External identifiers that disambiguate this Album edition.
          items:
            $ref: "#/components/schemas/ReleaseIdentifier"
        trackCount:
          type: integer
        genres:
          type: array
          deprecated: true
          description: Legacy Genre names retained for API v1 compatibility.
          items:
            type: string
        genreItems:
          type: array
          description: Normalized Genres derived from active Tracks.
          items:
            $ref: "#/components/schemas/Genre"
        artwork:
          $ref: "#/components/schemas/AlbumArtwork"
    AlbumList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        total:
          type: integer
    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/Album"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/Track"
    TrackWaveform:
      type: object
      required: [trackId, peakCount, peaks]
      properties:
        trackId:
          type: string
          format: uuid
        peakCount:
          type: integer
        peaks:
          type: array
          description: Loudest sample per equal time slice, normalized to 0..255.
          items:
            type: integer
            minimum: 0
            maximum: 255
    TrackWaveformPending:
      type: object
      required: [status, retryAfterSeconds]
      properties:
        status:
          type: string
          enum: [pending]
        retryAfterSeconds:
          type: integer
    TrackLyrics:
      type: object
      required: [trackId, lyrics]
      properties:
        trackId:
          type: string
          format: uuid
        lyrics:
          type: string
          description: Plain lyrics, or LRC text (`[mm:ss.xx] words`) when synced, with newline-separated lines; empty when there are none.

    Track:
      type: object
      required: [id, title, artistName, albumId, durationMs, format]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artistName:
          type: string
          deprecated: true
          description: Legacy display credit retained for API v1 compatibility.
        artists:
          type: array
          description: Ordered normalized Track Artist credits.
          items:
            $ref: "#/components/schemas/ArtistCredit"
        albumArtists:
          type: array
          description: Ordered Album Artist credits, independent from Track Artists.
          items:
            $ref: "#/components/schemas/ArtistCredit"
        explicit:
          type: boolean
          description: Whether Deezer marks the Track as explicit; absent or false when it is not known to be.
        albumId:
          type: string
          format: uuid
        albumTitle:
          type: string
        trackNo:
          type: integer
        discNo:
          type: integer
          minimum: 1
          description: Effective disc position; single-disc Albums use 1.
        trackTotal:
          type: integer
          minimum: 1
        discTotal:
          type: integer
          minimum: 1
        durationMs:
          type: integer
        format:
          type: string
        codec:
          type: string
        container:
          type: string
        sampleFormat:
          type: string
        genre:
          type: string
          deprecated: true
          description: Legacy Genre value retained for API v1 compatibility.
        genres:
          type: array
          description: Ordered normalized Track Genres.
          items:
            $ref: "#/components/schemas/Genre"
        sampleRateHz:
          type: integer
        bitDepth:
          type: integer
        channelCount:
          type: integer
        bitrateBps:
          type: integer
        bitrateKbps:
          type: integer
        sizeBytes:
          type: integer
        replayGain:
          $ref: "#/components/schemas/ReplayGainMetadata"
        titleSort:
          type: string
          description: Normalized title the library sorts and matches by.
        filePath:
          type: string
          description: >-
            Canonical Library Path of the authoritative audio file in Managed
            Storage. Empty on the Guest Listener.
        fileMtime:
          type: integer
          format: int64
          description: Modification time of the managed file, seconds since the Unix epoch.
        contentSha256:
          type: string
          description: Full-file SHA-256 of the managed audio bytes.
        identityKey:
          type: string
          description: Strict position-and-title identity within the Album.
        revision:
          type: integer
          minimum: 1
          description: Increments on Track Replacement or Track credit repair.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReplayGainMetadata:
      type: object
      required: [trackGainDb, trackPeak, albumGainDb, albumPeak]
      properties:
        trackGainDb:
          type: number
          format: double
          nullable: true
        trackPeak:
          type: number
          format: double
          nullable: true
        albumGainDb:
          type: number
          format: double
          nullable: true
        albumPeak:
          type: number
          format: double
          nullable: true
    TrackList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
    LibrarySearchResultType:
      type: string
      enum: [track, album, artist, genre, playlist]
    LibrarySearchMatch:
      type: string
      description: >-
        `direct` records match without typo correction, with their own title/name
        contributing, and are the only Best Match candidates. `corrected` records
        match through bounded typo correction. `related` is retained for API v1
        compatibility but is no longer emitted.
      enum: [direct, related, corrected]
    LibrarySearchAlbumReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    LibrarySearchResult:
      type: object
      required: [type, id, name, match]
      properties:
        type:
          $ref: "#/components/schemas/LibrarySearchResultType"
        id:
          type: string
        name:
          type: string
          description: The original display title or name
        match:
          $ref: "#/components/schemas/LibrarySearchMatch"
        artists:
          type: array
          description: Track credits for a Track, Album Artist credits for an Album, in credit order
          items:
            $ref: "#/components/schemas/ArtistCredit"
        album:
          $ref: "#/components/schemas/LibrarySearchAlbumReference"
    LibrarySearchResponse:
      type: object
      required: [tracks, albums, artists, genres, playlists]
      properties:
        total:
          type: integer
          minimum: 0
          description: Unique ranked matches across all groups before the cap, counting the Best Match only once; optional for older servers
        bestMatch:
          $ref: "#/components/schemas/LibrarySearchResult"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySearchResult"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySearchResult"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySearchResult"
        genres:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySearchResult"
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySearchResult"
    ExternalTrack:
      type: object
      description: >-
        One playable result from the External Source. It is not stored in the
        Library and cannot join the Playback Queue or a Playlist.
      required: [id, title, artistName, durationMs, webpageUrl, extractor, hasArtwork]
      properties:
        id:
          type: string
          maxLength: 2048
          description: >-
            Opaque, signed token naming the External Track's page and
            extractor; valid only until the Music Server restarts.
        title:
          type: string
        artistName:
          type: string
          nullable: true
          description: yt-dlp's artist, else uploader, else channel
        durationMs:
          type: integer
          minimum: 0
          nullable: true
        webpageUrl:
          type: string
          nullable: true
          description: The External Track's page on its site, for attribution
        extractor:
          type: string
          description: yt-dlp extractor key, for example Soundcloud or Youtube
        hasArtwork:
          type: boolean
          description: >-
            True when /api/v1/external/tracks/{externalTrackId}/artwork serves
            a cover for it; show a placeholder otherwise.
    ExternalSearchResponse:
      type: object
      required: [source, items]
      properties:
        source:
          type: string
          description: The configured yt-dlp search prefix, for example scsearch
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalTrack"
    ExternalTrackPlayback:
      type: object
      required: [format, streamPath]
      properties:
        format:
          type: string
          enum: [progressive, hls]
        streamPath:
          type: string
          description: >-
            Music Server path to play from, relative to the stream base URL:
            /api/v1/external/tracks/{externalTrackId}/stream for progressive
            audio, /api/v1/external/tracks/{externalTrackId}/playlist.m3u8
            for HLS.
    Playlist:
      type: object
      required: [id, name, isDefault, trackCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isDefault:
          type: boolean
        trackCount:
          type: integer
    PlaylistList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
        total:
          type: integer
    PlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/Track"
    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PlaylistTrackAdd:
      type: object
      required: [trackId]
      properties:
        trackId:
          type: string
          format: uuid
    RadioNowPlaying:
      type: object
      properties:
