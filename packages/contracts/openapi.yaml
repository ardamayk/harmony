  /api/v1/external/search:
    get:
      tags: [external-source]
      operationId: searchExternalSource
      summary: Search the External Source through yt-dlp
      description: >-
        Runs one yt-dlp search with the operator's configured search prefix
        (EXTERNAL_SOURCE_SEARCH, for example scsearch) and returns at most
        limit External Tracks in the order yt-dlp listed them. Nothing is
        downloaded or stored; each id is an opaque, signed token that only
        this Music Server process accepts and that stops working when it
        restarts.
      parameters:
        - name: q
          in: query
          required: true
          description: The query text, passed to yt-dlp as one argument
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: External Tracks found by the External Source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "503":
          $ref: "#/components/responses/ExternalSourceUnavailable"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
  /api/v1/external/tracks/{externalTrackId}/playback:
    get:
      tags: [external-source]
      operationId: getExternalTrackPlayback
      summary: Resolve an External Track and tell the client how to play it
      description: >-
        Resolves the External Track's audio with yt-dlp (cached for a few
        minutes; only URLs are cached, never audio) and returns the Music
        Server path to stream it from. Progressive audio streams from
        /stream; HLS audio plays from /playlist.m3u8, whose suffix lets
        clients detect HLS from the URL.
      parameters:
        - $ref: "#/components/parameters/externalTrackId"
      responses:
        "200":
          description: How to play the External Track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalTrackPlayback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ExternalSourceDisabled"
        "422":
          $ref: "#/components/responses/ExternalTrackUnplayable"
        "502":
          $ref: "#/components/responses/ExternalSourceFailed"
        "503":
          $ref: "#/components/responses/ExternalSourceUnavailable"
        "504":
          $ref: "#/components/responses/ExternalSourceTimeout"
  /api/v1/external/tracks/{externalTrackId}/stream:
    head:
