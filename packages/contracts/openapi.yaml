        homepageUrl:
          type: string
          format: uri
        faviconUrl:
          type: string
          format: uri
        country:
          type: string
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        codec:
          type: string
        bitrate:
          type: integer
        source:
          type: string
        externalId:
          type: string
        isFavorite:
          type: boolean
        position:
          type: integer
        lastNowPlaying:
          $ref: "#/components/schemas/RadioNowPlaying"
    RadioStationList:
      type: object
