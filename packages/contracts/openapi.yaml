      properties:
        name:
          type: string
        streamUrl:
          type: string
          format: uri
        homepageUrl:
          type: string
          format: uri
        faviconUrl:
          type: string
          format: uri
        country:
          type: string
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        codec:
          type: string
        bitrate:
          type: integer
        source:
          type: string
        externalId:
          type: string
        isFavorite:
          type: boolean
    RadioStationPatch:
      type: object
      properties:
        name:
          type: string
        streamUrl:
          type: string
          format: uri
        homepageUrl:
          type: string
          format: uri
        faviconUrl:
          type: string
          format: uri
        country:
          type: string
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        codec:
          type: string
        bitrate:
          type: integer
        isFavorite:
          type: boolean
        position:
          type: integer
    RadioSearchResult:
      type: object
      required: [stationUuid, name, streamUrl, tags]
      properties:
        stationUuid:
          type: string
        name:
          type: string
        streamUrl:
          type: string
          format: uri
        homepageUrl:
          type: string
          format: uri
        faviconUrl:
          type: string
          format: uri
        country:
          type: string
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        codec:
          type: string
        bitrate:
          type: integer
        votes:
          type: integer
        healthStatus:
          type: string
          enum: [healthy, broken, unknown]
        lastCheckedAt:
          type: string
          format: date-time
        lastSuccessfulAt:
          type: string
          format: date-time
    RadioSearchResultList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RadioSearchResult"
        total:
          type: integer
    RadioCatalogOption:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
        stationCount:
          type: integer
    RadioCatalogOptionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RadioCatalogOption"
        total:
          type: integer
    RadioImportRequest:
      type: object
      properties:
        stationUuid:
          type: string
        result:
          $ref: "#/components/schemas/RadioSearchResult"
    DeleteResult:
      type: object
      required: [deletedFiles]
      properties:
        deletedFiles:
          type: integer
    AlbumDeletionPreview:
      type: object
      required: [albumId, albumTitle, trackCount, totalSizeBytes, tracks, playlistReferences, queueReferences, confirmationToken]
      properties:
        albumId:
          type: string
          format: uuid
        albumTitle:
          type: string
        trackCount:
          type: integer
          minimum: 1
        totalSizeBytes:
          type: integer
          minimum: 0
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/AlbumDeletionTrack"
        playlistReferences:
          type: array
          items:
            $ref: "#/components/schemas/TrackDeletionPlaylistReference"
        queueReferences:
          type: array
          items:
            $ref: "#/components/schemas/TrackDeletionQueueReference"
        confirmationToken:
          type: string
          description: Opaque token binding confirmation to the reviewed Album, its Tracks, managed files, and relationships
    AlbumDeletionTrack:
      type: object
      required: [trackId, trackTitle, sizeBytes]
      properties:
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
    AlbumDeletionFailed:
      type: object
      required: [trackId, trackTitle, reason]
      properties:
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        reason:
          type: string
    AlbumDeletionResult:
      type: object
      required: [deleted, stoppedAt, deletedFiles]
      properties:
        deleted:
          type: array
          items:
            $ref: "#/components/schemas/AlbumDeletionTrack"
        stoppedAt:
          nullable: true
          description: Null when every Track was deleted; otherwise the Track whose failure stopped the run
          allOf:
            - $ref: "#/components/schemas/AlbumDeletionFailed"
        deletedFiles:
          type: integer
          minimum: 0
    TrackDeletionPreview:
      type: object
      required: [trackId, trackTitle, managedFile, playlistReferences, queueReferences, confirmationToken]
      properties:
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        managedFile:
          $ref: "#/components/schemas/TrackDeletionManagedFile"
        playlistReferences:
          type: array
          items:
            $ref: "#/components/schemas/TrackDeletionPlaylistReference"
        queueReferences:
          type: array
          items:
            $ref: "#/components/schemas/TrackDeletionQueueReference"
        confirmationToken:
          type: string
          description: Opaque token binding confirmation to the reviewed Track, managed file, and relationships
    TrackDeletionManagedFile:
      type: object
      required: [path, sizeBytes]
      properties:
        path:
          type: string
          description: Managed Storage-relative canonical audio path
        sizeBytes:
          type: integer
          minimum: 0
    TrackDeletionPlaylistReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TrackDeletionQueueReference:
      type: object
      required: [userId, itemCount]
      properties:
        userId:
          type: string
        itemCount:
          type: integer
          minimum: 1
    TrackDeletionConfirmation:
      type: object
      required: [confirmationToken]
      properties:
        confirmationToken:
          type: string
    TrackReplacementPreview:
      type: object
      description: Every visible consequence of replacing a Managed Track's audio file while keeping its identity.
      required:
        - trackId
        - trackTitle
        - sourceFormat
        - technicalProperties
        - metadata
        - library
        - artwork
        - canonicalPath
        - oldFile
        - playlistReferences
        - queueReferences
        - confirmationToken
      properties:
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        sourceFormat:
          $ref: "#/components/schemas/TrackReplacementFieldDiff"
        technicalProperties:
          type: array
          items:
            $ref: "#/components/schemas/TrackReplacementFieldDiff"
        metadata:
          type: array
          items:
            $ref: "#/components/schemas/TrackReplacementFieldDiff"
        library:
          $ref: "#/components/schemas/TrackReplacementLibraryChange"
        artwork:
          $ref: "#/components/schemas/TrackReplacementArtworkChange"
        canonicalPath:
          $ref: "#/components/schemas/TrackReplacementFieldDiff"
        oldFile:
          $ref: "#/components/schemas/TrackReplacementFileDeletion"
        playlistReferences:
          type: array
          description: Playlist references that stay attached to the unchanged Track ID.
          items:
            $ref: "#/components/schemas/TrackDeletionPlaylistReference"
        queueReferences:
          type: array
          description: Queue references that stay attached to the unchanged Track ID.
          items:
            $ref: "#/components/schemas/TrackDeletionQueueReference"
        confirmationToken:
          type: string
          description: Opaque token binding confirmation to the reviewed Track, managed file, references, and replacement bytes
    TrackReplacementFieldDiff:
      type: object
      required: [field, current, replacement, isChanged]
      properties:
        field:
          type: string
        current:
          type: string
        replacement:
          type: string
        isChanged:
          type: boolean
    TrackReplacementLibraryChange:
      type: object
      required: [currentAlbumId, movesAlbum, createsAlbum, removesEmptyAlbum, removesEmptyArtists, createsArtists, createsGenres]
      properties:
        currentAlbumId:
          type: string
          format: uuid
        replacementAlbumId:
          type: string
          format: uuid
        movesAlbum:
          type: boolean
        createsAlbum:
          type: boolean
        removesEmptyAlbum:
          type: boolean
        removesEmptyArtists:
          type: array
          items:
            type: string
        createsArtists:
          type: array
          items:
            type: string
        createsGenres:
          type: array
          items:
            type: string
    TrackReplacementArtworkChange:
      type: object
      required: [currentMediaType, currentSha256, replacementMediaType, replacementSha256, isChanged, replacesAlbumArtwork]
      properties:
        currentMediaType:
          type: string
        currentSha256:
          type: string
        replacementMediaType:
          type: string
        replacementSha256:
          type: string
        isChanged:
          type: boolean
        replacesAlbumArtwork:
          type: boolean
          description: True when the Album's display artwork file itself is replaced.
    TrackReplacementFileDeletion:
      type: object
      required: [path, sizeBytes]
      properties:
        path:
          type: string
          description: Managed Storage-relative path of the previous managed file that will be deleted
        sizeBytes:
          type: integer
          minimum: 0
    TrackReplacementConfirmation:
      type: object
      required: [revision, confirmationToken]
      properties:
        revision:
          type: integer
          minimum: 1
        confirmationToken:
          type: string
    TrackReplacementResult:
      type: object
      required: [jobId, status, revision, trackId, deletedFiles]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [committed]
        revision:
          type: integer
          minimum: 1
        trackId:
          type: string
          format: uuid
        deletedFiles:
          type: integer
          minimum: 0
          format: date-time
    QueueItemSource:
      description: Origin captured when a track enters the queue. Omitted sources default to user. Source JSON is limited to 16384 bytes.
      oneOf:
        - $ref: "#/components/schemas/QueueAlbumSource"
        - $ref: "#/components/schemas/QueuePlaylistSource"
        - $ref: "#/components/schemas/QueueUserSource"
        - $ref: "#/components/schemas/QueueSuggestionSource"
      discriminator:
        propertyName: kind
        mapping:
          album: "#/components/schemas/QueueAlbumSource"
          playlist: "#/components/schemas/QueuePlaylistSource"
          user: "#/components/schemas/QueueUserSource"
          suggestion: "#/components/schemas/QueueSuggestionSource"
    QueueAlbumSource:
      type: object
      additionalProperties: false
      required: [kind, albumId, albumTitle, artistName]
      properties:
        kind:
          type: string
          enum: [album]
        albumId:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "\\S"
        albumTitle:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "\\S"
        artistName:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "\\S"
    QueuePlaylistSource:
      type: object
      additionalProperties: false
      required: [kind, playlistId, name]
      properties:
        kind:
          type: string
          enum: [playlist]
        playlistId:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "\\S"
        name:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "\\S"
    QueueUserSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user]
    QueueSuggestionSource:
      type: object
      additionalProperties: false
      required: [kind, basedOn]
      properties:
        kind:
          type: string
          enum: [suggestion]
        basedOn:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: "\\S"
    QueueItem:
      type: object
      required: [id, trackId, position, track]
      properties:
        source:
          $ref: "#/components/schemas/QueueItemSource"
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        position:
          type: integer
        track:
          $ref: "#/components/schemas/Track"
    Queue:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        revision:
          type: string
          description: Opaque version of this Queue state
    QueueEvent:
      type: object
      required: [revision, sequence, invalidates]
      properties:
        revision:
          type: string
          description: Latest Queue Revision when this event was emitted
        sequence:
          type: string
          pattern: "^[0-9]+$"
          description: Monotonically increasing event order, independent from opaque Queue Revision semantics
        invalidates:
          type: array
          description: Shared resources clients must refetch
          items:
            type: string
            enum: [queue]
    QueueReplace:
      description: Queue mutation bodies are limited to 1048576 bytes; invalid or oversized requests return 400. Queues may contain at most 1000 items.
      type: object
      required: [trackIds, revision]
      properties:
        source:
          $ref: "#/components/schemas/QueueItemSource"
        trackIds:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueItemAppend:
      description: Queue mutation bodies are limited to 1048576 bytes; invalid or oversized requests return 400. Queues may contain at most 1000 items.
      type: object
      required: [trackId, revision]
      properties:
        source:
          $ref: "#/components/schemas/QueueItemSource"
        trackId:
          type: string
          format: uuid
        revision:
          type: string
    QueueReorder:
      description: Queue mutation bodies are limited to 1048576 bytes; invalid or oversized requests return 400. Queues may contain at most 1000 items.
      type: object
      required: [itemIds, revision]
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [queue]
          properties:
            queue:
              $ref: "#/components/schemas/Queue"
